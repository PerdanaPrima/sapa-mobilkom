<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Presensi Geolocation — PT. Mobilkom Telekomindo</title>
  <meta name="theme-color" content="#1c3282">
  <link rel="icon" type="image/png" href="img/favicon.png">
  
  <!-- SAPA Official Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --brand-navy: #1c3282;
      --brand-navy-hover: #152664;
      --brand-navy-active: #0f1c48;
      --text-main: #0f172a;
      --text-secondary: #64748b;
      --radius-pill: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #ffffff;
      color: var(--text-main);
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 24px 80px 24px;
    }

    .wrap {
      width: 100%;
      max-width: 340px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* 1. Logo SAPA */
    .logo-container {
      padding-top: 8px;
      margin-bottom: 32px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo {
      height: 38px;
      width: auto;
      max-width: 160px;
      object-fit: contain;
    }

    /* Kontainer Bagian Form Presensi */
    #formSection {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.3s ease;
    }

    /* 2. Jam WIB */
    .time-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #eff6ff;
      color: var(--brand-navy);
      padding: 7px 20px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin-bottom: 40px;
      border: none;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #16a34a;
      box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.7);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 7px rgba(22, 163, 74, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
    }

    /* 3. Header & Deskripsi */
    .title {
      font-family: 'Funnel Display', 'Manrope', sans-serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }

    .desc {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-secondary);
      line-height: 1.55;
      margin-bottom: 40px;
      max-width: 300px;
    }

    /* 4. Tiga Komponen Langkah */
    .steps {
      width: 100%;
      max-width: 290px;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 0 auto 50px auto;
    }

    .steps li {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #f8fafc;
      padding: 11px 18px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      border: none;
      text-align: center;
    }

    .steps svg {
      flex-shrink: 0;
      color: var(--brand-navy);
    }

    /* 4. Live Camera Selfie Viewfinder */
    .camera-box {
      width: 100%;
      max-width: 290px;
      margin: 0 auto 24px auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .camera-frame {
      position: relative;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      overflow: hidden;
      background: #0f172a;
      border: 3px solid #1c3282;
      box-shadow: 0 10px 28px -4px rgba(28, 50, 130, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #cameraVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror effect for selfie */
    }

    .camera-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      color: #64748b;
      padding: 16px;
      text-align: center;
    }

    .camera-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      font-size: 11.5px;
      font-weight: 700;
      color: #16a34a;
      background: #f0fdf4;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      border: 1px solid #bbf7d0;
    }

    .camera-badge.off {
      color: #dc2626;
      background: #fef2f2;
      border-color: #fecaca;
    }

    /* 5. Tombol Presensi */
    .btn-submit {
      width: 100%;
      max-width: 290px;
      height: 50px;
      background: var(--brand-navy);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-pill);
      font-family: 'Manrope', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px -4px rgba(28, 50, 130, 0.28);
      margin: 0 auto;
    }

    .btn-submit:hover {
      background: var(--brand-navy-hover);
      transform: translateY(-1.5px);
      box-shadow: 0 10px 28px -4px rgba(28, 50, 130, 0.35);
    }

    .btn-submit:active {
      background: var(--brand-navy-active);
      transform: scale(0.98);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-external {
      width: 100%;
      max-width: 290px;
      height: 46px;
      background: #ffffff;
      color: var(--brand-navy);
      border: 1.5px solid var(--brand-navy);
      border-radius: var(--radius-pill);
      font-family: 'Manrope', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      margin: 16px auto 0 auto;
      display: none;
    }

    .btn-back-wa {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 46px;
      margin-top: 18px;
      background: #25D366;
      color: #ffffff;
      font-family: 'Manrope', sans-serif;
      font-size: 14px;
      font-weight: 700;
      border-radius: var(--radius-pill);
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.3);
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .btn-back-wa:hover {
      background: #20ba59;
    }
    .btn-back-wa:active {
      transform: scale(0.98);
    }

    /* =========================================================================
       STRUK DIGITAL HASIL PRESENSI (CLEAN POP-UP CARD ONLY)
       ========================================================================= */
    .status-card {
      width: 100%;
      max-width: 320px;
      margin: 12px auto 0 auto;
      padding: 24px 20px 22px 20px;
      border-radius: 22px;
      text-align: center;
      display: none;
      border: none;
      animation: popUpFade 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .receipt-photo-wrap {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      overflow: hidden;
      margin: 0 auto 14px auto;
      border: 2.5px solid #1c3282;
      box-shadow: 0 4px 12px rgba(28, 50, 130, 0.2);
      display: none;
    }

    .receipt-photo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @keyframes popUpFade {
      from { opacity: 0; transform: scale(0.96) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .status-card.success {
      background: #f8fafc;
      color: var(--text-main);
    }

    .status-card.error {
      background: #fef2f2;
      color: #7f1d1d;
    }

    /* Icon Sukses Berbentuk Lingkaran Bersih */
    .receipt-icon-box {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .receipt-icon-box.success {
      background: #dcfce7;
      color: #16a34a;
    }

    .receipt-icon-box.error {
      background: #fee2e2;
      color: #dc2626;
    }

    .receipt-main-title {
      font-family: 'Funnel Display', 'Manrope', sans-serif;
      font-size: 21px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 22px;
      letter-spacing: -0.02em;
    }

    .receipt-list {
      border-top: 1px dashed #e2e8f0;
      padding-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
    }

    .receipt-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .receipt-label {
      font-weight: 500;
      color: var(--text-secondary);
    }

    .receipt-val {
      font-weight: 700;
      color: var(--text-main);
      text-align: right;
    }

    .btn-retry {
      margin-top: 20px;
      padding: 10px 22px;
      border-radius: var(--radius-pill);
      background: #1c3282;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.35);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<main class="wrap">
  
  <!-- 1. Logo SAPA (Selalu Tampil di Atas) -->
  <div class="logo-container">
    <img src="img/sapa_logo.png" alt="SAPA Logo" class="logo" onerror="this.onerror=null; this.src='img/mobilkom_logo.png';">
  </div>

  <!-- Kontainer Form Input (Di-hide otomatis ketika presensi sukses) -->
  <div id="formSection">
    <!-- 2. Jam WIB -->
    <div class="time-badge">
      <span class="pulse-dot"></span>
      <span id="liveClock">--:--:-- WIB</span>
    </div>

    <!-- 3. Header Presensi Masuk / Pulang -->
    <h1 class="title" id="pageTitle">Presensi Masuk</h1>
    <p class="desc">Arahkan wajah ke kamera & pastikan GPS aktif untuk mencatat kehadiran.</p>

    <!-- 4. Live Camera Selfie Viewfinder -->
    <div class="camera-box">
      <div class="camera-frame">
        <video id="cameraVideo" autoplay playsinline muted></video>
        <div id="cameraPlaceholder" class="camera-placeholder">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          <span style="font-size: 11px; margin-top: 8px; font-weight: 600;">Memuat Kamera...</span>
        </div>
      </div>
      <div id="cameraStatusBadge" class="camera-badge">
        <span class="pulse-dot"></span>
        <span id="cameraStatusText">Kamera Aktif</span>
      </div>
    </div>

    <!-- Hidden Canvas untuk Snapshot -->
    <canvas id="photoCanvas" style="display: none;"></canvas>

    <!-- 5. Tombol Presensi -->
    <button id="btnAction" class="btn-submit" onclick="submitAttendance()">
      <span id="btnText">Kirim Presensi</span>
    </button>

    <!-- Tombol Buka di Chrome jika di WebView WA -->
    <button id="btnOpenBrowser" class="btn-external" onclick="openExternalBrowser()">
      Buka di Google Chrome
    </button>
  </div>

  <!-- Kartu Struk Digital Hasil Presensi (Pop-up Tunggal) -->
  <section id="statusBox" class="status-card">
    
    <!-- Thumbnail Foto Selfie Struk -->
    <div id="receiptPhotoWrap" class="receipt-photo-wrap">
      <img id="receiptPhotoImg" class="receipt-photo-img" src="" alt="Foto Selfie Presensi">
    </div>

    <!-- Ikon SVG Asli Bulat -->
    <div id="resIconBox" class="receipt-icon-box success">
      <svg id="resSvgSuccess" width="28" height="28" viewBox="0 0 256 256" fill="currentColor">
        <path d="M173.66,98.34a8,8,0,0,1,0,11.32l-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35A8,8,0,0,1,173.66,98.34ZM232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"/>
      </svg>
      <svg id="resSvgError" width="28" height="28" viewBox="0 0 256 256" fill="currentColor" style="display: none;">
        <path d="M165.66,101.66,139.31,128l26.35,26.34a8,8,0,0,1-11.32,11.32L128,139.31l-26.34,26.35a8,8,0,0,1-11.32-11.32L116.69,128,90.34,101.66a8,8,0,0,1,11.32-11.32L128,116.69l26.34-26.35A8,8,0,0,1,165.66,101.66ZM232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"/>
      </svg>
    </div>

    <h2 class="receipt-main-title" id="resTitle">Konfirmasi di WhatsApp</h2>

    <div id="receiptDetails" class="receipt-list">
      <div class="receipt-item">
        <span class="receipt-label">Nama</span>
        <span class="receipt-val" id="resName">-</span>
      </div>
      <div class="receipt-item">
        <span class="receipt-label">Pangkalan</span>
        <span class="receipt-val" id="resBase">-</span>
      </div>
      <div class="receipt-item">
        <span class="receipt-label">Waktu</span>
        <span class="receipt-val" id="resTime">-</span>
      </div>
      <div class="receipt-item">
        <span class="receipt-label">Status</span>
        <span class="receipt-val" id="resStatus" style="color: #16a34a;">Hadir</span>
      </div>
      <div class="receipt-item" id="resGeofenceRow">
        <span class="receipt-label">Area</span>
        <span class="receipt-val" id="resGeofence">Sesuai Radius</span>
      </div>
    </div>

    <!-- Box Aksi Balas WhatsApp (Singkat & Padat) -->
    <div id="waActionBox" style="display: none; margin-top: 16px; padding: 12px 14px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; text-align: center;">
      <div style="font-size: 11.5px; font-weight: 600; color: #64748b; margin-bottom: 6px;">Balas:</div>
      <button id="btnCopyCode" onclick="copyWaText()" type="button" style="display: inline-flex; align-items: center; justify-content: center; width: 100%; height: 38px; background: #f8fafc; border: 1.5px solid #0f172a; color: #0f172a; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 13.5px; border-radius: 9999px; cursor: pointer; transition: all 0.15s ease;">
        <span id="copyText">Sudah</span>
      </button>
      <div style="margin-top: 6px;">
        <a id="waDirectLink" href="https://wa.me/6282283432739?text=Sudah" target="_blank" style="font-size: 11px; color: #64748b; text-decoration: none; cursor: pointer; transition: color 0.15s ease;">Kirim ke WA</a>
      </div>
    </div>

    <!-- Error Message Container (Hanya jika error) -->
    <p id="resErrorMsg" style="display: none; font-size: 13px; line-height: 1.5; color: #991b1b; margin-top: 14px;"></p>
    <button id="btnRetryError" class="btn-retry" style="display: none;" onclick="resetFormState()">Coba Lagi</button>

  </section>

</main>

<script>
  // =========================================================================
  // KONFIGURASI SUPABASE & DEVICE IDENTIFIER (ANTI-TITIP ABSEN)
  // =========================================================================
  const SUPABASE_URL = "https://jkwyaqnzgopludvsykma.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_LX0mUofEU0QMP05zip3W9A_3l2yChrp";

  function getOrCreateDeviceId() {
    let deviceId = localStorage.getItem('sapa_device_fingerprint');
    if (!deviceId) {
      deviceId = 'dev_' + Math.random().toString(36).substring(2, 15) + '_' + Date.now();
      try { localStorage.setItem('sapa_device_fingerprint', deviceId); } catch(e) {}
    }
    return deviceId;
  }
  const DEVICE_FINGERPRINT = getOrCreateDeviceId();

  // 1. Inisialisasi Jam Realtime WIB & Auto-deteksi Judul
  let currentScanType = 'in';

  function updateClock() {
    const now = new Date();
    const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
    const wibDate = new Date(utc + (3600000 * 7));
    const hours = wibDate.getHours();
    const h = String(hours).padStart(2, '0');
    const m = String(wibDate.getMinutes()).padStart(2, '0');
    const s = String(wibDate.getSeconds()).padStart(2, '0');
    const clockEl = document.getElementById('liveClock');
    if (clockEl) clockEl.textContent = `${h}:${m}:${s} WIB`;

    const urlParams = new URLSearchParams(window.location.search);
    const forcedType = urlParams.get('type') || urlParams.get('scan');
    if (forcedType === 'out' || (!forcedType && hours >= 12)) {
      currentScanType = 'out';
      const tEl = document.getElementById('pageTitle');
      if (tEl) tEl.textContent = 'Presensi Pulang';
    } else {
      currentScanType = 'in';
      const tEl = document.getElementById('pageTitle');
      if (tEl) tEl.textContent = 'Presensi Masuk';
    }
  }
  setInterval(updateClock, 1000);
  updateClock();

  // 2. Inisialisasi Live Camera Selfie WebRTC
  let cameraStream = null;
  let isCameraActive = false;

  async function initLiveCamera() {
    const video = document.getElementById('cameraVideo');
    const placeholder = document.getElementById('cameraPlaceholder');
    const badge = document.getElementById('cameraStatusBadge');
    const badgeText = document.getElementById('cameraStatusText');

    try {
      const constraints = {
        video: {
          facingMode: 'user',
          width: { ideal: 640 },
          height: { ideal: 640 }
        },
        audio: false
      };
      cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = cameraStream;
      video.onloadedmetadata = () => {
        video.play();
        placeholder.style.display = 'none';
        isCameraActive = true;
        badge.className = 'camera-badge';
        badgeText.textContent = 'Kamera Aktif';
      };
    } catch (err) {
      console.warn('Gagal membuka kamera depan otomatis:', err);
      placeholder.innerHTML = `
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="15" y1="9" x2="9" y2="15"/>
          <line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
        <span style="font-size: 11px; margin-top: 6px; font-weight: 700; color: #dc2626;">Izinkan Akses Kamera</span>
      `;
      badge.className = 'camera-badge off';
      badgeText.textContent = 'Kamera Belum Diizinkan';
      isCameraActive = false;
    }
  }

  // Mulai inisialisasi kamera langsung saat halaman dimuat
  window.addEventListener('DOMContentLoaded', () => {
    initLiveCamera();
  });

  // 3. Tangkap Snapshot Foto Selfie dengan Watermark Resmi
  async function capturePhotoBlob(lat, lng) {
    const video = document.getElementById('cameraVideo');
    const canvas = document.getElementById('photoCanvas');

    if (!isCameraActive || !video || video.videoWidth === 0) {
      // Coba re-request izin kamera jika belum aktif
      try {
        await initLiveCamera();
      } catch(e) {}
    }

    const vw = video.videoWidth || 480;
    const vh = video.videoHeight || 480;
    const size = Math.min(vw, vh, 480);

    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');

    // Crop center square & mirror selfie
    ctx.save();
    ctx.translate(size, 0);
    ctx.scale(-1, 1);

    const sx = (vw - size) / 2;
    const sy = (vh - size) / 2;
    ctx.drawImage(video, sx, sy, size, size, 0, 0, size, size);
    ctx.restore();

    // Tambahkan Watermark Resmi Anti-Manipulasi di bawah foto
    const now = new Date();
    const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
    const wibDate = new Date(utc + (3600000 * 7));
    const timeStr = wibDate.toTimeString().split(' ')[0] + ' WIB';
    const dateStr = `${wibDate.getDate().toString().padStart(2,'0')}/${(wibDate.getMonth()+1).toString().padStart(2,'0')}/${wibDate.getFullYear()}`;

    // Gradient bar latar teks watermark
    const grad = ctx.createLinearGradient(0, size - 44, 0, size);
    grad.addColorStop(0, 'rgba(15, 23, 42, 0)');
    grad.addColorStop(1, 'rgba(15, 23, 42, 0.85)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, size - 44, size, 44);

    // Teks Watermark
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`SAPA • ${dateStr} ${timeStr}`, 10, size - 24);
    ctx.font = '10px sans-serif';
    ctx.fillStyle = '#cbd5e1';
    ctx.fillText(`GPS: ${lat.toFixed(6)}, ${lng.toFixed(6)}`, 10, size - 10);

    return new Promise((resolve) => {
      canvas.toBlob((blob) => {
        resolve(blob);
      }, 'image/jpeg', 0.68); // JPEG 68% optimal compression (~45-55 KB)
    });
  }

  // 4. Baca Token / User Identifier dari URL
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('t') || urlParams.get('token') || urlParams.get('u') || urlParams.get('user');

  function isWhatsAppWebView() {
    const ua = navigator.userAgent || navigator.vendor || window.opera;
    return (ua.indexOf('WhatsApp') > -1) || (ua.indexOf('WABuild') > -1);
  }

  function openExternalBrowser() {
    const currentUrl = window.location.href;
    if (/android/i.test(navigator.userAgent)) {
      window.location.href = `intent://${currentUrl.replace(/^https?:\/\//, '')}#Intent;scheme=https;package=com.android.chrome;end`;
    } else {
      window.location.href = currentUrl;
    }
  }

  if (!token) {
    document.getElementById('btnAction').disabled = true;
    showError('Tautan presensi tidak lengkap atau tidak terdaftar. Hubungi admin HRD atau ketik "Absen" di WhatsApp SAPA.');
  }

  function resetFormState() {
    document.getElementById('formSection').style.display = 'flex';
    document.getElementById('statusBox').style.display = 'none';
    const btn = document.getElementById('btnAction');
    const btnText = document.getElementById('btnText');
    btn.disabled = false;
    btnText.textContent = 'Kirim Presensi';
    if (!isCameraActive) {
      initLiveCamera();
    }
  }

  // 5. Eksekusi Presensi dengan Validasi Anti-Manipulasi & Upload Foto
  async function submitAttendance() {
    const btn = document.getElementById('btnAction');
    const btnText = document.getElementById('btnText');
    const btnExt = document.getElementById('btnOpenBrowser');

    if (!token) return;

    if (!navigator.geolocation) {
      showError('Ponsel Anda tidak mendukung fitur lokasi GPS.');
      return;
    }

    btn.disabled = true;
    btnText.innerHTML = '<span class="spinner" style="margin-right: 8px;"></span> Membaca Lokasi...';
    btnExt.style.display = 'none';

    const geoOptions = {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    };

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const acc = pos.coords.accuracy;

        // Anti-Manipulasi Layer 1: Validasi Akurasi GPS (Fake GPS Filter)
        if (acc <= 0 || acc > 150) {
          showError(`Akurasi sinyal GPS Anda tidak valid (${Math.round(acc)}m) atau terindikasi fake GPS. Pastikan GPS Presisi Tinggi aktif dan berada di area terbuka.`);
          btn.disabled = false;
          btnText.textContent = 'Coba Lagi';
          return;
        }

        btnText.innerHTML = '<span class="spinner" style="margin-right: 8px;"></span> Mengambil Foto...';

        // Ambil Foto Snapshot Selfie
        let photoBlob = null;
        let photoPublicUrl = null;
        try {
          photoBlob = await capturePhotoBlob(lat, lng);
        } catch(e) {
          console.warn('Gagal capture photo:', e);
        }

        // Upload Foto ke Supabase Storage (geotag_photos)
        if (photoBlob) {
          btnText.innerHTML = '<span class="spinner" style="margin-right: 8px;"></span> Mengunggah Bukti...';
          try {
            const cleanTok = String(token).replace(/[^a-zA-Z0-9]/g, '').substring(0, 10);
            const photoFileName = `geo_${cleanTok}_${Date.now()}.jpg`;
            const upRes = await fetch(`${SUPABASE_URL}/storage/v1/object/geotag_photos/${photoFileName}`, {
              method: 'POST',
              headers: {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                'Content-Type': 'image/jpeg',
                'x-upsert': 'true'
              },
              body: photoBlob
            });
            if (upRes.ok) {
              photoPublicUrl = `${SUPABASE_URL}/storage/v1/object/public/geotag_photos/${photoFileName}`;
            }
          } catch(eUp) {
            console.warn('Gagal upload ke Supabase Storage:', eUp);
          }
        }

        btnText.innerHTML = '<span class="spinner" style="margin-right: 8px;"></span> Menyimpan...';

        let data = null;
        let successRpc = false;

        const payload = {
          p_token: token,
          p_latitude: lat,
          p_longitude: lng,
          p_accuracy: acc,
          p_scan_type: currentScanType,
          p_device_fingerprint: DEVICE_FINGERPRINT,
          p_user_agent: navigator.userAgent,
          photo_url: photoPublicUrl
        };

        // 1. Coba panggil Supabase RPC
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/submit_geolocation_attendance`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            },
            body: JSON.stringify({
              p_token: token,
              p_latitude: lat,
              p_longitude: lng,
              p_accuracy: acc
            })
          });
          if (res.ok) {
            data = await res.json();
            if (data && data.success !== undefined) {
              successRpc = true;
            }
          } else {
            const errJson = await res.json().catch(() => ({}));
            data = errJson;
          }
        } catch (eRpc) {
          // fallback
        }

        // 2. Fallback ke endpoint server SAPA
        if (!successRpc || !data || data.code === 'PGRST202' || (data.message && data.message.includes('schema cache'))) {
          try {
            const resFallback = await fetch('/api/geotag/submit', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            if (resFallback.ok) {
              data = await resFallback.json();
            }
          } catch (eFallback) {
            // ignore
          }
        }

        if (data && data.success) {
          showSuccess(data, photoPublicUrl);
        } else {
          const errMessage = (data && data.message) ? data.message : 'Terjadi kendala saat mencatat presensi.';
          showError(errMessage);
        }
      },
      (geoErr) => {
        let msg = '';
        switch(geoErr.code) {
          case geoErr.PERMISSION_DENIED:
            msg = 'Izin lokasi pada browser belum diizinkan. Silakan izinkan akses lokasi untuk mencatat presensi.';
            if (isWhatsAppWebView()) {
              btnExt.style.display = 'block';
            }
            break;
          case geoErr.POSITION_UNAVAILABLE:
            msg = 'Sinyal GPS belum terdeteksi. Pastikan GPS di ponsel Anda sudah dinyalakan.';
            break;
          case geoErr.TIMEOUT:
            msg = 'Waktu pencarian lokasi habis. Silakan coba lagi.';
            break;
          default:
            msg = 'Kendala GPS: ' + geoErr.message;
        }
        showError(msg);
      },
      geoOptions
    );
  }

  // TAMPILKAN HANYA KARTU HASIL (FORM SEBELUMNYA DI-HIDE TOTAL)
  function showSuccess(data, photoUrl) {
    document.getElementById('formSection').style.display = 'none';

    // Matikan stream kamera untuk menghemat baterai HP
    if (cameraStream) {
      try {
        cameraStream.getTracks().forEach(track => track.stop());
      } catch(e) {}
    }

    const box = document.getElementById('statusBox');
    box.className = 'status-card success';
    box.style.display = 'block';

    const isEntryIn = (data.scan_type || currentScanType) === 'in';
    document.getElementById('resTitle').textContent = 'Konfirmasi di WhatsApp';

    // Tampilkan thumbnail foto selfie jika tersedia
    const photoWrap = document.getElementById('receiptPhotoWrap');
    const photoImg = document.getElementById('receiptPhotoImg');
    if (photoUrl && photoWrap && photoImg) {
      photoImg.src = photoUrl;
      photoWrap.style.display = 'block';
    } else {
      photoWrap.style.display = 'none';
    }

    document.getElementById('resIconBox').className = 'receipt-icon-box success';
    document.getElementById('resSvgSuccess').style.display = 'block';
    document.getElementById('resSvgError').style.display = 'none';

    document.getElementById('receiptDetails').style.display = 'flex';
    document.getElementById('resErrorMsg').style.display = 'none';
    document.getElementById('btnRetryError').style.display = 'none';

    document.getElementById('resName').textContent = data.employee_name || '-';
    document.getElementById('resBase').textContent = data.base_name || '-';
    document.getElementById('resTime').textContent = data.time_wib || '-';

    let statusText = data.entry_status;
    if (!isEntryIn) {
      if (!statusText || statusText === 'Terlambat') {
        statusText = 'Tepat Waktu';
      }
    } else {
      if (!statusText) {
        statusText = 'Tepat Waktu';
      }
    }
    document.getElementById('resStatus').textContent = statusText;

    const geoRow = document.getElementById('resGeofenceRow');
    if (data.is_in_geofence) {
      document.getElementById('resGeofence').textContent = 'Sesuai Area (' + (data.distance_m || 0) + 'm)';
    } else {
      document.getElementById('resGeofence').textContent = 'Luar Radius (' + (data.distance_m || 0) + 'm)';
    }

    // Update Tautan Balas ke Nomor Bot WhatsApp SAPA
    let botParam = urlParams.get('bot') || urlParams.get('phone') || '';
    if (data && (data.whatsapp_bot_phone || data.bot_phone)) {
      botParam = data.whatsapp_bot_phone || data.bot_phone;
    }
    let cleanBotPhone = String(botParam || '').replace(/[^\d]/g, '');
    if (cleanBotPhone.startsWith('0')) cleanBotPhone = '62' + cleanBotPhone.slice(1);
    if (!cleanBotPhone) cleanBotPhone = '6282283432739';

    const waLinkEl = document.getElementById('waDirectLink');
    if (waLinkEl) {
      waLinkEl.href = 'https://wa.me/' + cleanBotPhone + '?text=Sudah';
    }

    const actionBox = document.getElementById('waActionBox');
    if (actionBox) {
      actionBox.style.display = 'block';
    }
  }

  function copyWaText() {
    const textToCopy = "Sudah";
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(textToCopy).then(() => {
        showCopied();
      }).catch(() => {
        fallbackCopy(textToCopy);
      });
    } else {
      fallbackCopy(textToCopy);
    }
  }

  function fallbackCopy(text) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.position = "fixed";
    textArea.style.left = "-999999px";
    textArea.style.top = "-999999px";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
      document.execCommand('copy');
      showCopied();
    } catch (err) {
      alert('Gagal menyalin. Silakan ketik "Sudah" di chat WhatsApp.');
    }
    document.body.removeChild(textArea);
  }

  function showCopied() {
    const text = document.getElementById('copyText');
    const btn = document.getElementById('btnCopyCode');
    if (text && btn) {
      const origText = text.textContent;
      text.textContent = 'Tersalin!';
      btn.style.borderColor = '#16a34a';
      btn.style.color = '#16a34a';
      btn.style.background = '#f0fdf4';
      setTimeout(() => {
        text.textContent = origText;
        btn.style.borderColor = '#0f172a';
        btn.style.color = '#0f172a';
        btn.style.background = '#f8fafc';
      }, 2500);
    }
  }

  function showError(msg) {
    document.getElementById('formSection').style.display = 'none';

    const box = document.getElementById('statusBox');
    box.className = 'status-card error';
    box.style.display = 'block';

    document.getElementById('resTitle').textContent = 'Presensi Belum Berhasil';
    document.getElementById('resIconBox').className = 'receipt-icon-box error';
    document.getElementById('resSvgSuccess').style.display = 'none';
    document.getElementById('resSvgError').style.display = 'block';

    document.getElementById('receiptDetails').style.display = 'none';
    
    const actionBox = document.getElementById('waActionBox');
    if (actionBox) {
      actionBox.style.display = 'none';
    }

    const errEl = document.getElementById('resErrorMsg');
    errEl.style.display = 'block';
    errEl.textContent = msg;

    document.getElementById('btnRetryError').style.display = 'inline-block';
  }
</script>
